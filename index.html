<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gastos Familia &middot; Acceso</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#f9f9f7;color:#0b0b0b;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fcfcfb;border:1px solid rgba(11,11,11,.10);border-radius:16px;padding:32px;
    max-width:370px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.10)}
  h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin-bottom:5px}
  .sub{color:#52514e;font-size:13px;margin-bottom:20px}
  label{display:block;font-size:11px;color:#898781;margin:14px 0 5px;text-transform:uppercase;letter-spacing:.06em;font-weight:650}
  input[type=text],input[type=password]{width:100%;background:#f9f9f7;border:1px solid rgba(11,11,11,.14);
    color:#0b0b0b;border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit}
  input:focus{outline:2px solid #2a78d6;outline-offset:-1px}
  .chk{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:13px;color:#52514e;
    cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400}
  button{width:100%;background:#2a78d6;color:#fff;font-weight:650;border:none;border-radius:10px;
    padding:12px;font-size:15px;cursor:pointer;margin-top:12px;font-family:inherit}
  button:hover{filter:brightness(1.07)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#d03b3b;font-size:13px;margin-top:12px;display:none;text-align:center;font-weight:550}
  .foot{color:#898781;font-size:11px;margin-top:18px;text-align:center;line-height:1.6}
  @media (prefers-color-scheme: dark){
    body{background:#0d0d0d;color:#fff}
    .box{background:#1a1a19;border-color:rgba(255,255,255,.10);box-shadow:0 12px 40px rgba(0,0,0,.5)}
    .sub{color:#c3c2b7}
    input[type=text],input[type=password]{background:#0d0d0d;border-color:rgba(255,255,255,.16);color:#fff}
    button{background:#3987e5}
    .chk{color:#c3c2b7}
  }
</style>
</head>

<div class="box">
  <h1>Gastos Familia</h1>

  <label for="p">Contrase&ntilde;a</label>
  <input type="password" id="p" autocomplete="current-password">
  <label class="chk"><input type="checkbox" id="rec"> Recordarme en este dispositivo</label>

var STOREKEY='gastosfam_auth';
async function descifrar(u,p){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:150000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:IV},key,CT);
  var text=new TextDecoder().decode(pt);
  if(text.indexOf('<!--OK-->')!==0) throw new Error('bad');
  return text.slice(9);
}
async function entrar(){
  var u=document.getElementById('u').value, p=document.getElementById('p').value;
  var btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Verificando...';
  try{
    var html=await descifrar(u,p);
    var store=document.getElementById('rec').checked?localStorage:sessionStorage;
    try{store.setItem(STOREKEY,JSON.stringify({u:u,p:p}));}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('err').style.display='block';
    btn.disabled=false; btn.textContent='Entrar';
  }
}
document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')entrar();});
document.getElementById('u').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('p').focus();});
(async function(){
  var saved=null;
  try{saved=JSON.parse(sessionStorage.getItem(STOREKEY)||localStorage.getItem(STOREKEY));}catch(e){}
  if(saved&&saved.u!=null){
    try{var html=await descifrar(saved.u,saved.p);document.open();document.write(html);document.close();}
    catch(e){try{sessionStorage.removeItem(STOREKEY);localStorage.removeItem(STOREKEY);}catch(_){}}
  }
})();
</script>
